<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>New message — SMEY Portfolio</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #f1f5f9;
      font-family: Arial, Helvetica, sans-serif;
      color: #0f172a;
    "
  >
    <div
      style="
        display: none;
        max-height: 0;
        overflow: hidden;
        opacity: 0;
        mso-hide: all;
      "
    >
      New portfolio inquiry from {{name}}: {{subject}}
    </div>
    <table
      role="presentation"
      width="100%"
      cellspacing="0"
      cellpadding="0"
      border="0"
      style="background-color: #f1f5f9"
    >
      <tr>
        <td align="center" style="padding: 32px 12px">
          <table
            role="presentation"
            width="600"
            cellspacing="0"
            cellpadding="0"
            border="0"
            style="
              width: 100%;
              max-width: 600px;
              background-color: #ffffff;
              border: 1px solid #e2e8f0;
              border-radius: 16px;
            "
          >
            <tr>
              <td
                style="
                  padding: 28px 24px;
                  background-color: #0f172a;
                  border-radius: 16px 16px 0 0;
                  border-top: 4px solid #2563eb;
                "
              >
                <p
                  style="
                    margin: 0 0 24px;
                    font-size: 14px;
                    font-weight: 700;
                    letter-spacing: 3px;
                    color: #93c5fd;
                  "
                >
                  SMEY<span style="color: #ffffff">.</span>
                </p>
                <h1
                  style="
                    margin: 0 0 8px;
                    font-size: 26px;
                    line-height: 1.25;
                    color: #ffffff;
                  "
                >
                  New contact message
                </h1>
                <p
                  style="
                    margin: 0;
                    font-size: 14px;
                    line-height: 1.6;
                    color: #cbd5e1;
                  "
                >
                  Someone reached out through your portfolio.
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding: 28px 24px 0">
                <p
                  style="
                    margin: 0 0 8px;
                    font-size: 11px;
                    font-weight: 700;
                    letter-spacing: 1.5px;
                    color: #64748b;
                  "
                >
                  FROM
                </p>
                <h2
                  style="
                    margin: 0 0 6px;
                    font-size: 20px;
                    line-height: 1.4;
                    color: #0f172a;
                    overflow-wrap: anywhere;
                  "
                >
                  {{name}}
                </h2>
                <a
                  href="mailto:{{email}}"
                  style="
                    font-size: 14px;
                    line-height: 1.6;
                    color: #1d4ed8;
                    text-decoration: underline;
                    word-break: break-all;
                  "
                  >{{email}}</a
                >
                <table
                  role="presentation"
                  width="100%"
                  cellspacing="0"
                  cellpadding="0"
                  border="0"
                  style="margin-top: 24px; border-top: 1px solid #e2e8f0"
                >
                  <tr>
                    <td style="padding-top: 20px">
                      <p
                        style="
                          margin: 0 0 8px;
                          font-size: 11px;
                          font-weight: 700;
                          letter-spacing: 1.5px;
                          color: #64748b;
                        "
                      >
                        SUBJECT
                      </p>
                      <p
                        style="
                          margin: 0;
                          font-size: 16px;
                          font-weight: 600;
                          line-height: 1.6;
                          color: #0f172a;
                          overflow-wrap: anywhere;
                        "
                      >
                        {{subject}}
                      </p>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding: 24px">
                <p
                  style="
                    margin: 0 0 10px;
                    font-size: 11px;
                    font-weight: 700;
                    letter-spacing: 1.5px;
                    color: #64748b;
                  "
                >
                  MESSAGE
                </p>
                <table
                  role="presentation"
                  width="100%"
                  cellspacing="0"
                  cellpadding="0"
                  border="0"
                  style="
                    table-layout: fixed;
                    background-color: #f8fafc;
                    border: 1px solid #e2e8f0;
                    border-left: 3px solid #2563eb;
                    border-radius: 8px;
                  "
                >
                  <tr>
                    <!-- prettier-ignore -->
                    <td style="padding: 20px; font-size: 15px; line-height: 1.75; color: #334155; white-space: pre-wrap; overflow-wrap: anywhere; word-wrap: break-word;">{{message}}</td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding: 0 24px 28px">
                <table
                  role="presentation"
                  cellspacing="0"
                  cellpadding="0"
                  border="0"
                >
                  <tr>
                    <td
                      align="center"
                      bgcolor="#2563eb"
                      style="border-radius: 8px"
                    >
                      <a
                        href="mailto:{{email}}"
                        style="
                          display: inline-block;
                          padding: 14px 24px;
                          border: 1px solid #2563eb;
                          border-radius: 8px;
                          color: #ffffff;
                          font-size: 14px;
                          font-weight: 700;
                          text-decoration: none;
                        "
                        >Reply to sender &rarr;</a
                      >
                    </td>
                  </tr>
                </table>
                <p
                  style="
                    margin: 12px 0 0;
                    font-size: 12px;
                    line-height: 1.6;
                    color: #64748b;
                  "
                >
                  You can also use Reply in your email app.
                </p>
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding: 20px 24px;
                  border-top: 1px solid #e2e8f0;
                  border-radius: 0 0 16px 16px;
                  background-color: #f8fafc;
                "
              >
                <p
                  style="
                    margin: 0;
                    font-size: 12px;
                    line-height: 1.6;
                    color: #64748b;
                  "
                >
                  Sent from the SMEY Portfolio contact form.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
