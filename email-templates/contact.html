<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>New message — SMEY Portfolio</title>
  </head>
  <body style="margin: 0; padding: 0; background-color: #f5f6f8">
    <div style="display: none; max-height: 0; overflow: hidden; mso-hide: all">
      {{name}} sent a message: {{subject}}
    </div>
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      border="0"
      style="
        background-color: #f5f6f8;
        font-family: Arial, Helvetica, sans-serif;
      "
    >
      <tr>
        <td align="center" style="padding: 24px 12px">
          <table
            role="presentation"
            width="560"
            cellpadding="0"
            cellspacing="0"
            border="0"
            style="
              width: 100%;
              max-width: 560px;
              background-color: #ffffff;
              border: 1px solid #e5e7eb;
              border-radius: 12px;
            "
          >
            <tr>
              <td
                style="
                  padding: 24px 24px 20px;
                  border-bottom: 1px solid #eef0f3;
                  font-family: Arial, Helvetica, sans-serif;
                "
              >
                <p
                  style="
                    margin: 0 0 18px;
                    font-family: Arial, Helvetica, sans-serif;
                    font-size: 12px;
                    line-height: 1.5;
                    font-weight: 700;
                    letter-spacing: 2px;
                    color: #2563eb;
                  "
                >
                  SMEY<span style="color: #111827">.</span>
                </p>
                <h1
                  style="
                    margin: 0;
                    font-family: Arial, Helvetica, sans-serif;
                    font-size: 22px;
                    line-height: 1.4;
                    font-weight: 600;
                    color: #111827;
                  "
                >
                  New message
                </h1>
                <p
                  style="
                    margin: 6px 0 0;
                    font-family: Arial, Helvetica, sans-serif;
                    font-size: 12px;
                    line-height: 1.6;
                    color: #6b7280;
                  "
                >
                  {{time}}
                </p>
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding: 22px 24px 0;
                  font-family: Arial, Helvetica, sans-serif;
                "
              >
                <p
                  style="
                    margin: 0 0 6px;
                    font-family: Arial, Helvetica, sans-serif;
                    font-size: 12px;
                    line-height: 1.5;
                    color: #6b7280;
                  "
                >
                  From
                </p>
                <p
                  style="
                    margin: 0 0 4px;
                    font-family: Arial, Helvetica, sans-serif;
                    font-size: 16px;
                    line-height: 1.5;
                    font-weight: 600;
                    color: #111827;
                    overflow-wrap: anywhere;
                  "
                >
                  {{name}}
                </p>
                <a
                  href="mailto:{{email}}"
                  style="
                    font-family: Arial, Helvetica, sans-serif;
                    font-size: 13px;
                    line-height: 1.6;
                    color: #2563eb;
                    text-decoration: underline;
                    word-break: break-all;
                  "
                  >{{email}}</a
                >
                <p
                  style="
                    margin: 20px 0 6px;
                    font-family: Arial, Helvetica, sans-serif;
                    font-size: 12px;
                    line-height: 1.5;
                    color: #6b7280;
                  "
                >
                  Subject
                </p>
                <p
                  style="
                    margin: 0;
                    font-family: Arial, Helvetica, sans-serif;
                    font-size: 15px;
                    line-height: 1.6;
                    font-weight: 600;
                    color: #111827;
                    overflow-wrap: anywhere;
                  "
                >
                  {{subject}}
                </p>
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding: 20px 24px 24px;
                  font-family: Arial, Helvetica, sans-serif;
                "
              >
                <p
                  style="
                    margin: 0 0 8px;
                    font-family: Arial, Helvetica, sans-serif;
                    font-size: 12px;
                    line-height: 1.5;
                    color: #6b7280;
                  "
                >
                  Message
                </p>
                <table
                  role="presentation"
                  width="100%"
                  cellpadding="0"
                  cellspacing="0"
                  border="0"
                  style="
                    table-layout: fixed;
                    background-color: #f8fafc;
                    border: 1px solid #eef0f3;
                    border-radius: 8px;
                  "
                >
                  <tr>
                    <!-- prettier-ignore -->
                    <td style="padding:16px;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.75;color:#374151;white-space:pre-wrap;overflow-wrap:anywhere;word-wrap:break-word;">{{message}}</td>
                  </tr>
                </table>
                <table
                  role="presentation"
                  cellpadding="0"
                  cellspacing="0"
                  border="0"
                  style="margin-top: 20px"
                >
                  <tr>
                    <td bgcolor="#111827" style="border-radius: 6px">
                      <a
                        href="mailto:{{email}}"
                        style="
                          display: inline-block;
                          padding: 12px 22px;
                          border: 1px solid #111827;
                          border-radius: 6px;
                          font-family: Arial, Helvetica, sans-serif;
                          font-size: 13px;
                          line-height: 1.5;
                          font-weight: 600;
                          color: #ffffff;
                          text-decoration: none;
                        "
                        >Reply to message &rarr;</a
                      >
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding: 16px 24px;
                  border-top: 1px solid #eef0f3;
                  font-family: Arial, Helvetica, sans-serif;
                "
              >
                <p
                  style="
                    margin: 0;
                    font-family: Arial, Helvetica, sans-serif;
                    font-size: 11px;
                    line-height: 1.6;
                    color: #6b7280;
                  "
                >
                  Sent from your SMEY Portfolio contact form.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
